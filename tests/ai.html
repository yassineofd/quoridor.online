<!doctype html>
<meta charset="utf-8">
<title>AI matches</title>
<pre id="result">running</pre>
<script src="../static/assets/js/engine.js"></script>
<script src="../static/assets/js/ai.js"></script>
<script>
(function () {
  var Q = window.Quoridor, AI = window.QuoridorAI;
  var cfg = JSON.parse(decodeURIComponent(location.hash.slice(1))); // set by tests/ai_bench.py

  // Small seeded generator so a run can be repeated.
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function play(levelFirst, levelSecond, seed, stats) {
    var g = new Q.Game(), levels = [levelFirst, levelSecond], rng = mulberry(seed);
    while (g.winner === null && g.moves.length < cfg.maxPlies) {
      var lv = levels[g.turn], t0 = performance.now();
      // realTime: the strongest level gets its real per-move time budget (what a player gets);
      // otherwise it gets a fixed node count, which is repeatable but not what ships.
      var move = AI.chooseMove(g, cfg.realTime ? { level: lv, rng: rng } : { level: lv, rng: rng, timeMs: 0, maxNodes: cfg.expertNodes });
      var dt = performance.now() - t0;
      var s = stats[lv] || (stats[lv] = { moves: 0, ms: 0, worst: 0 });
      s.moves++; s.ms += dt; if (move.type === 'wall') s.walls = (s.walls || 0) + 1; if (dt > s.worst) s.worst = dt;
      var before = g.moves.length, err = g.apply(move);
      if (err) throw new Error(lv + ' produced an illegal move ' + JSON.stringify(move) + ': ' + err);
      if (g.moves.length !== before + 1) throw new Error('move not recorded');
    }
    return g.winner; // null when the ply limit was hit
  }

  var out = { matches: [], stats: {} };
  cfg.pairs.forEach(function (pair) {
    var a = pair[0], b = pair[1], wins = { a: 0, b: 0, none: 0 };
    for (var i = 0; i < cfg.games; i++) {
      var aFirst = i % 2 === 0;
      var seed = (cfg.seedBase || 1000) + i;
      var w = aFirst ? play(a, b, seed, out.stats) : play(b, a, seed, out.stats);
      if (w === null) wins.none++;
      else if ((w === 0) === aFirst) wins.a++;
      else wins.b++;
    }
    out.matches.push({ a: a, b: b, games: cfg.games, aWins: wins.a, bWins: wins.b, unfinished: wins.none });
  });
  Object.keys(out.stats).forEach(function (k) {
    var s = out.stats[k];
    s.avgMs = Math.round(s.ms / s.moves * 10) / 10; s.worst = Math.round(s.worst); delete s.ms;
  });
  document.getElementById('result').textContent = JSON.stringify(out);
})();
</script>
